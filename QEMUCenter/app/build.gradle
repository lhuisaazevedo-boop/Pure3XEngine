plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pure3x.qemucenter'
    compileSdk 36


    defaultConfig {
        applicationId "com.pure3x.qemucenter"

        minSdk 29
        targetSdk 36

        versionCode 1
        versionName "0.1.0 Alpha"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            minifyEnabled false
        }
    }
}
