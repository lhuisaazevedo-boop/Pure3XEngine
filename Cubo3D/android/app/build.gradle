plugins {
    id 'com.android.application'
}

android {
    namespace "com.pure3x.cubo3d"
    compileSdk 33
    buildToolsVersion "33.0.2"

    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.pure3xengenie.emulador"
        minSdk 29
        targetSdk 33
        versionCode 1
        versionName "0.2.5 Alpha"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20 -fexceptions -frtti"
                arguments "-DANDROID_ABI=arm64-v8a"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packagingOptions {
        pickFirst "lib/arm64-v8a/libvulkan.so.1"
        pickFirst "lib/arm64-v8a/libc++_shared.so"
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
}

