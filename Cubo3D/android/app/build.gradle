plugins {
    id 'com.android.application'
}

android {
    namespace "com.pure3x.cubo3d"

    compileSdk 36
    buildToolsVersion "36.0.0"

    // O Android Gradle Plugin seleciona este NDK pelo SDK local.
    ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId "com.pure3xengenie.emulador"

        minSdk 29
        targetSdk 36

        versionCode 1
        versionName "0.2.6 Alpha"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20 -fexceptions -frtti"
                arguments "-DPUREX_ANDROID=ON", "-DPUREX_ENGINE=ON"
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }

        release {
            debuggable false
            minifyEnabled false
            shrinkResources false

            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file("../../CMakeLists.txt")
            version "3.22.1"
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packagingOptions {
        pickFirst "lib/arm64-v8a/libvulkan.so"
        pickFirst "lib/arm64-v8a/libc++_shared.so"
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
}
